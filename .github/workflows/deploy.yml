name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual re-runs via the Actions tab

permissions:
  contents: read
  deployments: write

concurrency:
  group: cf-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 1e6b58b7709bbe6cc20b1cc88cebbd25
          command: pages deploy dist --project-name=datapeople-astro --branch=main --commit-dirty=true
