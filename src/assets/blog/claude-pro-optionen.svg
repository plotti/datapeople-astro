<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#101A30"/>
      <stop offset="1" stop-color="#0C2233"/>
    </linearGradient>
    <radialGradient id="glowOrange" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D97757" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coinGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7CE5B"/>
      <stop offset="1" stop-color="#DE9B26"/>
    </linearGradient>
    <linearGradient id="coinRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F08A6B"/>
      <stop offset="1" stop-color="#C0483A"/>
    </linearGradient>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#3B5378" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <ellipse cx="430" cy="430" rx="560" ry="420" fill="url(#glowOrange)"/>
  <ellipse cx="1280" cy="470" rx="520" ry="400" fill="url(#glowTeal)"/>

  <!-- Titelzeile -->
  <text x="90" y="120" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#F1F5F9">Claude Pro reicht nicht?</text>
  <text x="90" y="172" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#8FA3BF">Claude Code behalten · Modell wechseln · 200 Dollar sparen</text>

  <!-- Terminal-Fenster -->
  <g>
    <rect x="120" y="248" width="640" height="430" rx="18" fill="#0D1526" stroke="#2A3B58" stroke-width="2"/>
    <rect x="120" y="248" width="640" height="48" rx="18" fill="#16233B"/>
    <rect x="120" y="278" width="640" height="18" fill="#16233B"/>
    <circle cx="152" cy="272" r="7" fill="#E5484D"/>
    <circle cx="176" cy="272" r="7" fill="#F5C044"/>
    <circle cx="200" cy="272" r="7" fill="#3DD68C"/>
    <text x="440" y="279" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8FA3BF">claude — session</text>

    <text x="152" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" fill="#F1F5F9">$ <tspan fill="#E8825A" font-weight="700">claude</tspan> "tests fixen"</text>
    <rect x="152" y="354" width="18" height="26" fill="#D97757">
      <animate attributeName="opacity" values="1;0;1" dur="1.4s" repeatCount="indefinite"/>
    </rect>

    <rect x="152" y="408" width="420" height="12" rx="6" fill="#334766"/>
    <rect x="152" y="436" width="500" height="12" rx="6" fill="#D97757" opacity="0.75"/>
    <rect x="152" y="464" width="330" height="12" rx="6" fill="#2DD4BF" opacity="0.7"/>
    <rect x="152" y="492" width="470" height="12" rx="6" fill="#334766"/>
    <rect x="152" y="520" width="280" height="12" rx="6" fill="#334766"/>

    <rect x="152" y="580" width="560" height="60" rx="12" fill="#1A0F12" stroke="#C0483A" stroke-width="2"/>
    <text x="176" y="618" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#F08A6B">✕ Kontingent aufgebraucht</text>
  </g>

  <!-- Options-Karten -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="840" y="250" width="640" height="118" rx="16" fill="#16233B" stroke="#2DD4BF" stroke-width="2"/>
    <text x="880" y="298" font-size="30" font-weight="700" fill="#4FE3CE">Z.ai · GLM Coding Plan</text>
    <text x="880" y="340" font-size="23" fill="#8FA3BF">$18 / Monat · Credits pro 5 h + Woche</text>

    <rect x="840" y="386" width="640" height="118" rx="16" fill="#16233B" stroke="#5B7CAD" stroke-width="2"/>
    <text x="880" y="434" font-size="30" font-weight="700" fill="#AFC3DE">OpenRouter · DeepSeek V4.1</text>
    <text x="880" y="476" font-size="23" fill="#8FA3BF">pay per Token · ab $0.15 / $0.60 pro Mio.</text>

    <rect x="840" y="522" width="640" height="118" rx="16" fill="#16233B" stroke="#F5C044" stroke-width="2"/>
    <text x="880" y="570" font-size="30" font-weight="700" fill="#F7CE5B">Flat-Rate · DevPass / Hyper</text>
    <text x="880" y="612" font-size="23" fill="#8FA3BF">$10–$40 / Monat · unlimitierte Token</text>
  </g>

  <!-- Münzen: 200 durchgestrichen -->
  <g>
    <circle cx="1330" cy="726" r="62" fill="url(#coinRed)" stroke="#8E332A" stroke-width="3"/>
    <text x="1330" y="742" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#3A0F0A">$200</text>
    <path d="M 1284 680 L 1376 772" stroke="#F1F5F9" stroke-width="7" stroke-linecap="round"/>

    <rect x="1000" y="700" width="250" height="70" rx="16" fill="#16233B" stroke="#F5C044" stroke-width="2.5"/>
    <text x="1125" y="746" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#F7CE5B">Max-Tarif</text>
    <path d="M 1250 735 L 1276 735" stroke="#8FA3BF" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
  </g>
</svg>
