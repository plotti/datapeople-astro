<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#101A30"/>
      <stop offset="1" stop-color="#0C2233"/>
    </linearGradient>
    <radialGradient id="glowOrange" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D97757" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coinGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7CE5B"/>
      <stop offset="1" stop-color="#DE9B26"/>
    </linearGradient>
    <linearGradient id="coinTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FE3CE"/>
      <stop offset="1" stop-color="#149E8C"/>
    </linearGradient>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#3B5378" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Hintergrund -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <ellipse cx="430" cy="430" rx="560" ry="420" fill="url(#glowOrange)"/>
  <ellipse cx="1260" cy="480" rx="520" ry="400" fill="url(#glowTeal)"/>

  <!-- Titelzeile -->
  <text x="90" y="122" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#F1F5F9">Claude Code günstiger nutzen</text>
  <text x="90" y="172" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#8FA3BF">Z.ai · GLM · Zed · 30 US-Dollar im Monat</text>

  <!-- Terminal-Fenster (Claude) -->
  <g>
    <rect x="120" y="250" width="600" height="420" rx="18" fill="#0D1526" stroke="#2A3B58" stroke-width="2"/>
    <rect x="120" y="250" width="600" height="48" rx="18" fill="#16233B"/>
    <rect x="120" y="280" width="600" height="18" fill="#16233B"/>
    <circle cx="152" cy="274" r="7" fill="#E5484D"/>
    <circle cx="176" cy="274" r="7" fill="#F5C044"/>
    <circle cx="200" cy="274" r="7" fill="#3DD68C"/>
    <text x="420" y="281" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8FA3BF">~/.claude/settings.json</text>

    <text x="152" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#F1F5F9">$ <tspan fill="#E8825A" font-weight="700">claude</tspan></text>
    <rect x="152" y="356" width="18" height="26" fill="#D97757">
      <animate attributeName="opacity" values="1;0;1" dur="1.4s" repeatCount="indefinite"/>
    </rect>

    <rect x="152" y="412" width="380" height="12" rx="6" fill="#334766"/>
    <rect x="152" y="440" width="470" height="12" rx="6" fill="#D97757" opacity="0.75"/>
    <rect x="152" y="468" width="300" height="12" rx="6" fill="#2DD4BF" opacity="0.7"/>
    <rect x="152" y="496" width="430" height="12" rx="6" fill="#334766"/>
    <rect x="152" y="524" width="360" height="12" rx="6" fill="#334766"/>
    <rect x="152" y="552" width="240" height="12" rx="6" fill="#D97757" opacity="0.55"/>

    <text x="152" y="622" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#3DD68C">✓ Kontingent weitläufiger nutzbar</text>
  </g>

  <!-- Editor-Fenster (Zed) -->
  <g>
    <rect x="790" y="310" width="620" height="360" rx="18" fill="#0D1526" stroke="#2A3B58" stroke-width="2"/>
    <rect x="790" y="310" width="620" height="48" rx="18" fill="#16233B"/>
    <rect x="790" y="340" width="620" height="18" fill="#16233B"/>
    <circle cx="822" cy="334" r="7" fill="#E5484D"/>
    <circle cx="846" cy="334" r="7" fill="#F5C044"/>
    <circle cx="870" cy="334" r="7" fill="#3DD68C"/>
    <text x="1100" y="341" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8FA3BF">main.rs — Zed</text>

    <text x="812" y="402" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B5378">1</text>
    <rect x="846" y="390" width="200" height="11" rx="5.5" fill="#5B7CAD"/>
    <rect x="1062" y="390" width="120" height="11" rx="5.5" fill="#334766"/>
    <text x="812" y="432" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B5378">2</text>
    <rect x="846" y="420" width="130" height="11" rx="5.5" fill="#D97757" opacity="0.8"/>
    <rect x="992" y="420" width="280" height="11" rx="5.5" fill="#334766"/>
    <text x="812" y="462" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B5378">3</text>
    <rect x="846" y="450" width="330" height="11" rx="5.5" fill="#2DD4BF" opacity="0.75"/>
    <text x="812" y="492" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B5378">4</text>
    <rect x="846" y="480" width="90" height="11" rx="5.5" fill="#F5C044" opacity="0.8"/>
    <rect x="952" y="480" width="230" height="11" rx="5.5" fill="#334766"/>
    <text x="812" y="522" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B5378">5</text>
    <rect x="846" y="510" width="270" height="11" rx="5.5" fill="#334766"/>
    <text x="812" y="552" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B5378">6</text>
    <rect x="846" y="540" width="160" height="11" rx="5.5" fill="#5B7CAD"/>
    <rect x="1022" y="540" width="180" height="11" rx="5.5" fill="#2DD4BF" opacity="0.6"/>
    <text x="812" y="582" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3B5378">7</text>
    <rect x="846" y="570" width="310" height="11" rx="5.5" fill="#334766"/>
    <rect x="846" y="608" width="150" height="10" rx="5" fill="#D97757" opacity="0.6"/>
    <rect x="1012" y="608" width="90" height="10" rx="5" fill="#334766"/>
  </g>

  <!-- Verbindungslinie Terminal → Editor -->
  <path d="M 720 460 C 750 460 760 480 790 490" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.8"/>

  <!-- Chips -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600">
    <rect x="120" y="700" width="168" height="52" rx="26" fill="#16233B" stroke="#D97757" stroke-width="2"/>
    <text x="204" y="734" text-anchor="middle" font-size="22" fill="#E8825A">Z.ai · GLM</text>
    <rect x="308" y="700" width="108" height="52" rx="26" fill="#16233B" stroke="#2DD4BF" stroke-width="2"/>
    <text x="362" y="734" text-anchor="middle" font-size="22" fill="#4FE3CE">Zed</text>
    <rect x="436" y="700" width="150" height="52" rx="26" fill="#16233B" stroke="#5B7CAD" stroke-width="2"/>
    <text x="511" y="734" text-anchor="middle" font-size="22" fill="#AFC3DE">Claude Pro</text>
  </g>

  <!-- Münzen -->
  <g>
    <circle cx="1330" cy="596" r="56" fill="url(#coinGold)" stroke="#B07E1C" stroke-width="3"/>
    <text x="1330" y="610" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#3A2A05">$20</text>
    <circle cx="1462" cy="520" r="42" fill="url(#coinTeal)" stroke="#0E7B6D" stroke-width="3"/>
    <text x="1462" y="531" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#05302A">$10</text>

    <path d="M 1330 664 L 1330 706" stroke="#8FA3BF" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
    <path d="M 1450 556 L 1382 700" stroke="#8FA3BF" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>

    <rect x="1226" y="716" width="210" height="74" rx="16" fill="#16233B" stroke="#F5C044" stroke-width="2.5"/>
    <text x="1331" y="764" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#F7CE5B">$30 / Monat</text>
  </g>
</svg>
